<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coachbuddy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FAVICON -->
    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCEsy3JshuCcp0rymJuhtf2MTszkAF88z_eQ&s">
    <link rel="apple-touch-icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCEsy3JshuCcp0rymJuhtf2MTszkAF88z_eQ&s">

    <!-- iOS WEB APP CAPABILITIES -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Coachbuddy">
    <meta name="theme-color" content="#121212">

    <style>
        /* CRITICAL FIX: Ensure padding and borders do not expand element size beyond 100% */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            /* Remove tap highlight on mobile */
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        html {
            height: 100%;
        }

        /* Base and Mobile-First Styling */
        body {
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            /* Dark background for modern look */
            color: #E0E0E0;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;

            font-size: 13px;
            /* Base font size increased */

            /* --- ADD HUGE TOP PADDING FOR SCROLL BUFFER --- */
            padding-top: 50vh;
        }

        /* Center content and apply background to the main area */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: auto;
            /* FIX: Push content up to counteract body's top padding, keeping content aligned at the top */
            margin-top: -50vh;
        }

        /* Container to center content on larger screens */
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 8px 6px;
            /* Ensure bottom padding for iPhone Home bar */
            padding-bottom: 40px;
        }

        /* --- SECTION BASE STYLES --- */
        #timer-section,
        #input-section,
        #roster-container,
        #notes-section,
        #team-name-section,
        #mini-timer-section {
            background-color: #1E1E1E;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        /* --- TEAM NAME/NOTES SECTION STYLES --- */
        #notes-section,
        #team-name-section {
            width: 100%;
            padding: 8px;
            border-radius: 12px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        #game-notes,
        #team-select {
            padding: 7px;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 16px;
            background-color: #2D2D2D;
            color: #E0E0E0;
            width: 100%;
            box-sizing: border-box;
        }

        #game-notes {
            min-height: 80px;
            resize: vertical;
        }


        /* --- TIMER SECTION STYLES --- */
        #timer-section {
            text-align: center;
        }

        #time-display {
            font-size: 2.7rem;
            font-weight: 700;
            color: #4CAF50;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        #time-display.countdown-ended {
            color: #D32F2F;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            width: 100%;
        }

        .timer-controls.adjust-controls {
            margin-top: 6px;
        }

        .timer-btn {
            padding: 9px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 13px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
        }

        /* Buttons inside timer controls rows should be equal width */
        .timer-controls .timer-btn {
            flex: 1;
        }

        .timer-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .timer-btn.primary {
            background-color: #007bff;
            color: white;
        }

        .timer-btn.primary.pause {
            background-color: #FF9800;
        }

        .timer-btn.secondary,
        .timer-btn.mode-btn {
            background-color: #424242;
            color: #E0E0E0;
        }

        .timer-btn.secondary:hover,
        .timer-btn.mode-btn:hover {
            background-color: #555;
        }

        /* --- PLAYER INPUT SECTION STYLES --- */
        #input-section {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #player-number-input,
        #player-name {
            padding: 7px;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 16px;
            background-color: #2D2D2D;
            color: #E0E0E0;
        }

        #player-number-input {
            width: 45px;
            flex-shrink: 0;
            text-align: center;
        }

        #player-name {
            flex-grow: 1;
        }

        /* Style for the green plus icon button */
        .add-icon-btn {
            background-color: #4CAF50;
            color: white;
            width: 32px;
            height: 32px;
            font-size: 19px;
            line-height: 32px;
            padding: 0;
            border-radius: 8px;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
        }

        /* --- ROSTER TOOLBAR (Sort Buttons) --- */
        .roster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333;
        }

        .roster-title {
            font-weight: bold;
            font-size: 14px;
            color: #B0B0B0;
        }

        .sort-buttons-group {
            display: flex;
            gap: 6px;
        }

        .sort-btn {
            background-color: #333;
            color: #E0E0E0;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sort-btn:active {
            background-color: #555;
        }

        /* --- PLAYER ROSTER STYLES --- */
        #roster {
            overflow: hidden;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #333;
        }

        .player-info-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
            padding-right: 8px;
        }

        /* UPDATED: Player Rank Styling */
        .player-rank {
            font-weight: 700;
            color: white;
            /* Default text color (for rank 5+) */
            background-color: #424242;
            /* Default dark gray background (for rank 5+) */
            font-size: 14px;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 8px;
            flex-shrink: 0;
            margin-right: 4px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Rank Colors */
        .player-rank.rank-color-1 {
            background-color: #D32F2F;
            color: white;
        }

        .player-rank.rank-color-2 {
            background-color: #FFC107;
            color: #121212;
        }

        .player-rank.rank-color-3 {
            background-color: #4CAF50;
            color: white;
        }

        .player-rank.rank-color-4 {
            background-color: #007bff;
            color: white;
        }

        .player-number {
            font-weight: 700;
            color: #64B5F6;
            font-size: 15px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .player-name {
            font-weight: 500;
            font-size: 15px;
            word-break: break-word;
        }

        .warning-icon {
            font-size: 16px;
            margin-left: 5px;
            display: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .warning-icon.low {
            color: #FFC107;
        }

        .player-time {
            font-weight: bold;
            color: #64B5F6;
            font-size: 15px;
            min-width: 50px;
            text-align: right;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .player-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .toggle-btn {
            padding: 5px 8px;
            width: 60px;
            font-size: 13px;
            border-radius: 8px;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
        }

        .toggle-btn.status-on {
            background-color: #4CAF50;
            color: white;
        }

        .toggle-btn.status-off {
            background-color: #D32F2F;
            color: white;
        }

        .delete-btn {
            width: 24px;
            height: 24px;
            font-size: 13px;
            line-height: 1;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #424242;
            color: white;
        }

        /* --- MODIFIED: MINI TIMER SECTION --- */
        #mini-timer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
        }

        #mini-time-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: #E0E0E0;
            font-variant-numeric: tabular-nums;
        }

        #mini-time-display.countdown-ended {
            color: #D32F2F;
        }

        .mini-timer-controls {
            display: flex;
            gap: 8px;
        }

        .mini-timer-controls .timer-btn {
            min-width: 70px;
        }


        /* --- MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1E1E1E;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: left;
        }

        #modal-title {
            font-size: 1.4rem;
            margin-top: 0;
            color: #E0E0E0;
            text-align: center;
        }

        #modal-message {
            margin-bottom: 20px;
            color: #B0B0B0;
            font-size: 16px;
            white-space: pre-line;
        }

        /* Suggestion text styling */
        .suggestion-group {
            background-color: #2D2D2D;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .suggestion-group strong {
            font-size: 1.2rem;
            color: white;
            display: block;
            margin-bottom: 6px;
        }

        .suggestion-group .sub-off {
            color: #FF8A80;
        }

        .suggestion-group .sub-on {
            color: #B9F6CA;
        }

        .suggestion-group p {
            margin: 4px 0;
            font-size: 1.1rem;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            text-align: center;
        }

        .modal-buttons .timer-btn {
            flex-basis: auto;
            padding: 10px 15px;
            font-size: 14px;
        }

        /* Separator for close button */
        .modal-buttons .suggestion-close-btn {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <div class="app-container">

            <!-- TEAM NAME SECTION -->
            <div id="team-name-section">
                <label for="team-select" style="display:block; margin-bottom: 5px; font-weight: bold;">Team
                    Name:</label>
                <select id="team-select">
                    <option value="" disabled selected>Select a Team...</option>
                    <option value="TLS Aces">TLS Aces</option>
                    <option value="Testing Team">Testing Team</option>
                </select>
            </div>

            <!-- TIMER SECTION -->
            <div id="timer-section">
                <div id="time-display">00:00</div>
                <div class="timer-controls mode-main-controls">
                    <button id="start-pause-btn" class="timer-btn primary">Start</button>
                    <button id="reset-btn" class="timer-btn secondary">Reset</button>
                </div>
                <div class="timer-controls adjust-controls">
                    <button id="add-minute-btn" class="timer-btn secondary">+30 Sec</button>
                    <button id="subtract-minute-btn" class="timer-btn secondary">–30 Sec</button>
                </div>
            </div>

            <!-- PLAYER INPUT SECTION -->
            <div id="input-section">
                <input type="text" id="player-number-input" placeholder="No." inputmode="numeric">
                <input type="text" id="player-name" placeholder="Enter player's name">
                <button id="add-player-btn" class="add-icon-btn">+</button>
            </div>

            <!-- PLAYER ROSTER -->
            <div id="roster-container">
                <div class="roster-header">
                    <span class="roster-title">Current Roster</span>
                    <div class="sort-buttons-group">
                        <button id="sort-desc-btn" class="sort-btn">Most ⇩</button>
                        <button id="sort-asc-btn" class="sort-btn">Least ⇧</button>
                    </div>
                </div>
                <div id="roster"></div>
            </div>

            <!-- MODIFIED: MINI TIMER SECTION -->
            <div id="mini-timer-section">
                <div id="mini-time-display">03:00</div>
                <div class="mini-timer-controls">
                    <button id="mini-start-pause-btn" class="timer-btn primary">Start</button>
                    <button id="mini-reset-btn" class="timer-btn secondary">Reset</button>
                </div>
            </div>

            <!-- NOTES SECTION -->
            <div id="notes-section">
                <label for="game-notes" style="display:block; margin-bottom: 5px; font-weight: bold;">Notes:</label>
                <textarea id="game-notes" placeholder="Add game notes here..."></textarea>
            </div>

            <!-- ACTION BUTTONS -->
            <div style="margin-top: 10px;">
                <button id="save-to-sheets-btn" class="timer-btn primary"
                    style="width: 100%; background-color: #1a73e8;">Finish Game</button>
            </div>
            <div style="margin-top: 5px;">
                <button id="suggest-sub-btn" class="timer-btn secondary"
                    style="width: 100%; background-color: #673ab7; color: white; border: none; font-weight: bold;">Smart
                    Suggestions</button>
            </div>
            <div style="margin-top: 5px;">
                <button id="add-default-players-btn" class="timer-btn secondary" style="width: 100%;">Add Default Players</button>
            </div>
            <div style="margin-top: 5px;">
                <button id="update-app-btn" class="timer-btn secondary" style="width: 100%;">Update App</button>
            </div>

        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <div id="modal-message"></div>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const MAX_PLAYERS_ON_FIELD = 5;
        const MIN_GAME_TIME_FOR_WARNINGS = 240; // 4 minutes before warnings start

        // WARNING CONFIGURATION
        const LOW_TIME_RATIO = 0.65; // Warn if < 65% of average
        const SIGNIFICANT_TIME_GAP = 240; // 4 minutes (240s). If player is 4 mins behind average, warn regardless of %

        const INITIAL_STOPWATCH_SECONDS = 0;
        const DEFAULT_COUNTDOWN_SECONDS = 2400; // 40 minutes
        const LOCAL_STORAGE_KEY = 'coachbuddySelectedTeam';
        const DEFAULT_MINI_TIMER_SECONDS = 180; // 3 minutes

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOYayTMqPpYI5p1GTTcnbzQcAGUgJmukPkT1rZ8HiaCE86H9iJxP-hEaw-t23NnxuG6w/exec';

        // --- STATE VARIABLES ---
        let countdownInterval = null, totalSeconds = INITIAL_STOPWATCH_SECONDS, isRunning = false, isCountdownMode = false;
        let miniTimerInterval = null, miniTotalSeconds = DEFAULT_MINI_TIMER_SECONDS, isMiniTimerRunning = false;

        // --- UTILITY FUNCTION ---
        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        // --- DOM ELEMENTS ---
        const timeDisplay = document.getElementById('time-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const addMinuteBtn = document.getElementById('add-minute-btn');
        const subtractMinuteBtn = document.getElementById('subtract-minute-btn');
        const playerNumberInput = document.getElementById('player-number-input');
        const playerNameInput = document.getElementById('player-name');
        const addPlayerBtn = document.getElementById('add-player-btn');
        const rosterDiv = document.getElementById('roster');
        const suggestSubBtn = document.getElementById('suggest-sub-btn');
        const addDefaultPlayersBtn = document.getElementById('add-default-players-btn');
        const saveToSheetsBtn = document.getElementById('save-to-sheets-btn');
        const teamSelect = document.getElementById('team-select');
        const miniTimeDisplay = document.getElementById('mini-time-display');
        const miniStartPauseBtn = document.getElementById('mini-start-pause-btn');
        const miniResetBtn = document.getElementById('mini-reset-btn');
        const sortDescBtn = document.getElementById('sort-desc-btn');
        const sortAscBtn = document.getElementById('sort-asc-btn');

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            const savedTeam = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (savedTeam) teamSelect.value = savedTeam;
        });
        teamSelect.addEventListener('change', () => {
            localStorage.setItem(LOCAL_STORAGE_KEY, teamSelect.value);
        });

        // --- ADVANCED MODAL LOGIC ---
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalButtons = document.getElementById('modal-buttons');

        function closeModal() { customModal.style.display = 'none'; }

        function showCustomModal(title, messageHtml, buttons) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = messageHtml;
            modalButtons.innerHTML = '';

            buttons.forEach(btnInfo => {
                const button = document.createElement('button');
                button.textContent = btnInfo.text;
                button.className = `timer-btn ${btnInfo.className || 'primary'}`;
                button.onclick = (e) => btnInfo.action(e);
                modalButtons.appendChild(button);
            });
            customModal.style.display = 'flex';
        }

        function showConfirmation(title, message, callback) {
            let buttons = [];
            if (callback) {
                // Confirmation dialog with a choice. Confirm is first, Cancel is last (bottom).
                buttons.push({ text: 'Confirm', className: 'primary', action: () => { callback(true); closeModal(); } });
                buttons.push({ text: 'Cancel', className: 'secondary', action: () => { callback(false); closeModal(); } });
            } else {
                // Simple "OK" dialog
                buttons.push({ text: 'OK', className: 'primary', action: closeModal });
            }
            showCustomModal(title, `<p>${message}</p>`, buttons);
        }

        // --- PLAYER ROSTER LOGIC ---
        function createPlayerItem(name, number = null) {
            const playerItem = document.createElement('div');
            playerItem.className = 'player-item';
            playerItem.dataset.totalTime = 0; playerItem.dataset.isOnField = '0'; playerItem.dataset.rank = '0';

            const playerInfoGroup = document.createElement('div');
            playerInfoGroup.className = 'player-info-group';

            const playerRankDisplay = document.createElement('span');
            playerRankDisplay.className = 'player-rank'; playerRankDisplay.textContent = '-';
            playerRankDisplay.dataset.role = 'player-rank-display';
            playerInfoGroup.appendChild(playerRankDisplay);

            if (number !== null) {
                const playerNumber = document.createElement('span');
                playerNumber.className = 'player-number'; playerNumber.textContent = `#${number}`;
                playerInfoGroup.appendChild(playerNumber);
            }

            const playerName = document.createElement('span');
            playerName.className = 'player-name'; playerName.textContent = name;
            playerInfoGroup.appendChild(playerName);

            const lowWarningIcon = document.createElement('span');
            lowWarningIcon.className = 'warning-icon low'; lowWarningIcon.textContent = '⚠️';
            lowWarningIcon.title = 'Low play time - Consider subbing on';
            lowWarningIcon.dataset.role = 'low-warning-icon';
            playerInfoGroup.appendChild(lowWarningIcon);

            const playerControlsGroup = document.createElement('div');
            playerControlsGroup.className = 'player-controls-group';
            const timeOnFieldDisplay = document.createElement('span');
            timeOnFieldDisplay.className = 'player-time'; timeOnFieldDisplay.textContent = formatTime(0);

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-btn status-off'; toggleBtn.textContent = 'ON';

            toggleBtn.onclick = () => {
                const isOn = playerItem.dataset.isOnField === '1';
                if (isOn) {
                    playerItem.dataset.isOnField = '0';
                    toggleBtn.textContent = 'ON';
                    toggleBtn.classList.add('status-off'); toggleBtn.classList.remove('status-on');
                } else {
                    const currentOnCount = document.querySelectorAll('.player-item[data-is-on-field="1"]').length;
                    if (currentOnCount >= MAX_PLAYERS_ON_FIELD) {
                        showConfirmation('Substitution Limit Reached', `Cannot sub this player ON. You have the maximum of ${MAX_PLAYERS_ON_FIELD} players on the field. Please sub a player OFF first.`);
                        return;
                    }
                    playerItem.dataset.isOnField = '1';
                    toggleBtn.textContent = 'OFF';
                    toggleBtn.classList.remove('status-off'); toggleBtn.classList.add('status-on');
                    const lowIcon = playerItem.querySelector('[data-role="low-warning-icon"]');
                    if (lowIcon) lowIcon.style.display = 'none';
                }
                updateSubstitutionWarnings();
            };
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn'; deleteBtn.textContent = '×';
            deleteBtn.title = 'Remove Player';
            deleteBtn.onclick = () => {
                showConfirmation('Remove Player', `Are you sure you want to remove ${name}?`, (confirmed) => {
                    if (confirmed) { rosterDiv.removeChild(playerItem); updateSubstitutionWarnings(); }
                });
            };

            playerControlsGroup.appendChild(timeOnFieldDisplay);
            playerControlsGroup.appendChild(toggleBtn);
            playerControlsGroup.appendChild(deleteBtn);
            playerItem.appendChild(playerInfoGroup);
            playerItem.appendChild(playerControlsGroup);
            return playerItem;
        }

        function addPlayerByName(name, number = null) {
            const effectiveName = name || (number !== null ? `Player #${number}` : 'Unnamed Player');
            rosterDiv.appendChild(createPlayerItem(effectiveName, number));
            updateSubstitutionWarnings();
        }

        function addPlayerFromInput() {
            const name = playerNameInput.value.trim();
            const number = parseInt(playerNumberInput.value.trim()) || null;
            if (name || number) {
                addPlayerByName(name, number);
                playerNameInput.value = ''; playerNumberInput.value = ''; playerNameInput.focus();
                // Prevent mobile keyboard from hiding context
                setTimeout(() => { window.scrollTo(0, 0); }, 200);
            }
        }

        addPlayerBtn.addEventListener('click', addPlayerFromInput);
        playerNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayerFromInput(); });
        playerNumberInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayerFromInput(); });

        // --- ORDERING LOGIC ---
        function sortRoster(direction) {
            const items = Array.from(rosterDiv.children);
            items.sort((a, b) => {
                const timeA = parseInt(a.dataset.totalTime);
                const timeB = parseInt(b.dataset.totalTime);
                if (direction === 'desc') {
                    return timeB - timeA; // High to Low
                } else {
                    return timeA - timeB; // Low to High
                }
            });
            items.forEach(item => rosterDiv.appendChild(item));
        }

        sortDescBtn.addEventListener('click', () => sortRoster('desc'));
        sortAscBtn.addEventListener('click', () => sortRoster('asc'));

        const DEFAULT_ROSTERS = {
            'TLS Aces': [{ name: 'Ava', number: 6 }, { name: 'Maddie', number: 32 }, { name: 'AK', number: 52 },
            { name: 'Indigo', number: 50 }, { name: 'Aria', number: 7 }, { name: 'London', number: 8 },
            { name: 'Elektra', number: null }, { name: 'Mila', number: null }],
            'Testing Team': [{ name: 'Tester 1', number: 1 }, { name: 'Tester 2', number: 2 }, { name: 'Tester 3', number: 3 }, { name: 'Tester 4', number: 4 }]
        };

        addDefaultPlayersBtn.addEventListener('click', () => {
            const selectedTeam = teamSelect.value;
            if (!selectedTeam) { showConfirmation('No Team Selected', 'Please select a team before adding default players.'); return; }
            const roster = DEFAULT_ROSTERS[selectedTeam];
            if (!roster || roster.length === 0) { showConfirmation('No Default Roster', `No default players defined for "${selectedTeam}".`); return; }
            showConfirmation(`Add Roster for ${selectedTeam}`, `Add the default roster for ${selectedTeam}? This will not remove existing players.`,
                (confirmed) => { if (confirmed) roster.forEach(p => addPlayerByName(p.name, p.number)); }
            );
        });

        function performSub(playerOff, playerOn, buttonElement) {
            if (playerOff && playerOff.element) playerOff.element.querySelector('.toggle-btn')?.click();
            if (playerOn && playerOn.element) playerOn.element.querySelector('.toggle-btn')?.click();

            buttonElement.textContent += ' ✅';
            buttonElement.disabled = true;
        }

        let aiAbortController = null;

        async function fetchAiSuggestion() {
            const goalSelect = document.getElementById('ai-goal-select');
            const loadingDiv = document.getElementById('ai-loading');
            const buttonsDiv = document.getElementById('modal-buttons');

            if (!goalSelect) return;

            const goal = goalSelect.options[goalSelect.selectedIndex].text;
            loadingDiv.style.display = 'block';
            
            buttonsDiv.innerHTML = '';
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'timer-btn secondary';
            cancelBtn.style.width = '100%';
            cancelBtn.onclick = () => {
                if (aiAbortController) aiAbortController.abort();
                closeModal();
            };
            buttonsDiv.appendChild(cancelBtn);

            aiAbortController = new AbortController();

            const playerItems = document.querySelectorAll('.player-item');
            const onField = [];
            const offField = [];

            playerItems.forEach(item => {
                const name = `${item.querySelector('.player-number')?.textContent || ''} ${item.querySelector('.player-name')?.textContent || 'Unnamed'}`.trim();
                const time = parseInt(item.dataset.totalTime);
                const isOnField = item.dataset.isOnField === '1';

                const playerData = `- ${name} (Time played: ${formatTime(time)})`;
                if (isOnField) onField.push(playerData);
                else offField.push(playerData);
            });

            const notes = document.getElementById('game-notes').value.trim();
            const timeStr = formatTime(totalSeconds);

            const prompt = `You are a coach assistant. We have ${onField.length} players on the field and ${offField.length} on the bench.
Our players ranked from best to worst are: London, Indigo, Mila, Aria, Maddie, Ava, AK, Elektra.
Goal for this substitution: ${goal}
Current Game Time: ${timeStr} (Max time: 39:00)
${notes ? `Game Notes (injuries, late players, etc): ${notes}\n` : ''}
Current players on the field:
${onField.length > 0 ? onField.join('\n') : 'None'}

Current players on the bench:
${offField.length > 0 ? offField.join('\n') : 'None'}

Who should I sub OUT (from the field) and who should I sub IN (from the bench)?
Preferably suggest subbing 2 players at once, but you can suggest more or fewer if the game situation requires it.
Provide a short, direct suggestion (max 2 sentences). Explain why based on the goal.`;

            try {
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
                    method: 'POST',
                    signal: aiAbortController.signal,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-goog-api-key': 'AIzaSyBKV0XQh-q53XKGfQTEgjRp5h0TQllIzkQ'
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                const data = await response.json();

                buttonsDiv.innerHTML = ''; // clear cancel button
                
                if (data.candidates && data.candidates.length > 0) {
                    const suggestionText = data.candidates[0].content.parts[0].text;
                    const formattedText = suggestionText.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    showCustomModal('Smart Suggestions', `<div style="font-size: 1.1rem; line-height: 1.4; color: #E0E0E0; text-align: left;">${formattedText}</div>`, [
                        { text: 'Close', action: closeModal }
                    ]);
                } else {
                    throw new Error("No suggestion returned");
                }
            } catch (error) {
                if (error.name === 'AbortError') return; // Do nothing if aborted by user
                buttonsDiv.innerHTML = '';
                showCustomModal('AI Error', 'Failed to get suggestion from AI.', [{ text: 'OK', action: closeModal }]);
            }
        }

        function suggestSubstitution() {
            const playerItems = document.querySelectorAll('.player-item');
            if (playerItems.length < 2) { showConfirmation('Guahh AI Unavailable', 'Please add at least two players.'); return; }

            const onFieldCount = document.querySelectorAll('.player-item[data-is-on-field="1"]').length;
            const benchCount = playerItems.length - onFieldCount;

            if (onFieldCount === 0 || benchCount === 0) {
                showConfirmation('Guahh AI Unavailable', 'You need at least one player on the field and one on the bench.');
                return;
            }

            let messageHtml = `
                <div style="margin-bottom: 15px; text-align: left;">
                    <label for="ai-goal-select" style="display:block; margin-bottom: 8px; font-weight: bold; color: white;">Game Situation:</label>
                    <select id="ai-goal-select" style="width: 100%; padding: 10px; border-radius: 8px; background-color: #2D2D2D; color: white; border: 1px solid #444; font-size: 15px;">
                        <option value="win">We need to win (Play best players)</option>
                        <option value="even">Even play time (Fairness)</option>
                        <option value="any">Doesn't matter (Balanced)</option>
                    </select>
                </div>
                <div id="ai-loading" style="display: none; text-align: center; margin-top: 20px; margin-bottom: 10px;">
                    <span style="display: inline-block; animation: pulse 1.5s infinite; color: #b388ff; font-weight: bold; font-size: 16px;">Guahh AI is thinking...</span>
                </div>
            `;

            showCustomModal('Smart Suggestions', messageHtml, [
                {
                    text: 'Ask Guahh AI', className: 'primary', action: (e) => {
                        e.target.disabled = true;
                        e.target.textContent = 'Thinking...';
                        fetchAiSuggestion();
                    }
                },
                { text: 'Cancel', className: 'secondary', action: closeModal }
            ]);
        }
        suggestSubBtn.addEventListener('click', suggestSubstitution);

        function updateSubstitutionWarnings() {
            const items = document.querySelectorAll('.player-item'); if (items.length === 0) return;
            let totalTime = 0, onFieldTime = 0, onFieldCount = 0;
            const players = Array.from(items).map(item => {
                const time = parseInt(item.dataset.totalTime); totalTime += time;
                if (item.dataset.isOnField === '1') { onFieldTime += time; onFieldCount++; }
                return { element: item, time };
            });

            // Calculate Ranks
            players.sort((a, b) => b.time - a.time);
            let rank = 0, prevTime = -1;
            players.forEach(p => {
                const rankDisplay = p.element.querySelector('[data-role="player-rank-display"]');
                if (p.time !== prevTime) rank++; prevTime = p.time; p.element.dataset.rank = rank;
                if (rankDisplay) {
                    rankDisplay.textContent = rank;
                    rankDisplay.className = 'player-rank'; // Reset
                    if (rank === 1) rankDisplay.classList.add('rank-color-1');
                    else if (rank === 2) rankDisplay.classList.add('rank-color-2');
                    else if (rank === 3) rankDisplay.classList.add('rank-color-3');
                    else if (rank === 4) rankDisplay.classList.add('rank-color-4');
                }
            });

            // WARNING LOGIC
            if (players.length < 2 || totalSeconds < MIN_GAME_TIME_FOR_WARNINGS || totalTime === 0) {
                items.forEach(i => i.querySelector('[data-role="low-warning-icon"]').style.display = 'none'); return;
            }

            const avgTime = onFieldCount > 0 ? onFieldTime / onFieldCount : 0;

            items.forEach(item => {
                const icon = item.querySelector('[data-role="low-warning-icon"]');
                const time = parseInt(item.dataset.totalTime);
                const isOn = item.dataset.isOnField === '1';

                // Condition 1: Time is significantly lower by percentage (< 65%)
                const isLowRatio = time < (avgTime * LOW_TIME_RATIO);

                // Condition 2: Time is significantly lower by hard minutes (e.g. 4 minutes less)
                const isBigGap = (avgTime - time) > SIGNIFICANT_TIME_GAP;

                // Show warning if player is OFF field AND either condition is met
                if (!isOn && avgTime > 0 && (isLowRatio || isBigGap)) {
                    icon.style.display = 'inline';
                } else {
                    icon.style.display = 'none';
                }
            });
        }

        // --- MAIN TIMER LOGIC ---
        function startTimer() {
            if (isRunning || (isCountdownMode && totalSeconds <= 0)) return;
            isRunning = true; startPauseBtn.textContent = 'Pause'; startPauseBtn.classList.add('pause');
            countdownInterval = setInterval(() => {
                if (isCountdownMode) {
                    if (totalSeconds > 0) totalSeconds--;
                    else { clearInterval(countdownInterval); isRunning = false; startPauseBtn.textContent = 'Done!'; startPauseBtn.classList.remove('pause'); timeDisplay.classList.add('countdown-ended'); }
                } else totalSeconds++;
                timeDisplay.textContent = formatTime(totalSeconds);
                timeDisplay.classList.toggle('countdown-ended', isCountdownMode && totalSeconds <= 60 && totalSeconds > 0);
                document.querySelectorAll('.player-item[data-is-on-field="1"]').forEach(item => {
                    let time = parseInt(item.dataset.totalTime) + 1;
                    item.dataset.totalTime = time; item.querySelector('.player-time').textContent = formatTime(time);
                });
                updateSubstitutionWarnings();
            }, 1000);
        }
        function pauseTimer() { clearInterval(countdownInterval); isRunning = false; startPauseBtn.textContent = 'Resume'; startPauseBtn.classList.remove('pause'); }
        function resetTimer() {
            clearInterval(countdownInterval); isRunning = false;
            startPauseBtn.textContent = 'Start'; startPauseBtn.classList.remove('pause');
            timeDisplay.classList.remove('countdown-ended');
            totalSeconds = isCountdownMode ? DEFAULT_COUNTDOWN_SECONDS : INITIAL_STOPWATCH_SECONDS;
            timeDisplay.textContent = formatTime(totalSeconds);
            document.querySelectorAll('.player-item').forEach(item => {
                item.dataset.totalTime = 0; item.querySelector('.player-time').textContent = formatTime(0);
                item.dataset.isOnField = '0';
                const btn = item.querySelector('.toggle-btn');
                if (btn) { btn.textContent = 'ON'; btn.classList.add('status-off'); btn.classList.remove('status-on'); }
            });
            updateSubstitutionWarnings();
        }
        function adjustTime(s) { totalSeconds = Math.max(0, totalSeconds + s); timeDisplay.textContent = formatTime(totalSeconds); if (isCountdownMode && totalSeconds === 0 && isRunning) { clearInterval(countdownInterval); isRunning = false; startPauseBtn.textContent = 'Done!'; startPauseBtn.classList.add('countdown-ended'); } updateSubstitutionWarnings(); }
        startPauseBtn.addEventListener('click', () => isRunning ? pauseTimer() : startTimer());
        resetBtn.addEventListener('click', () => { showConfirmation('Confirm Timer Reset', 'Reset the main timer and all player times?', (c) => { if (c) resetTimer(); }); });
        addMinuteBtn.addEventListener('click', () => adjustTime(30));
        subtractMinuteBtn.addEventListener('click', () => adjustTime(-30));
        timeDisplay.textContent = formatTime(INITIAL_STOPWATCH_SECONDS);

        // --- MINI TIMER LOGIC ---
        function startMiniTimer() {
            if (isMiniTimerRunning || miniTotalSeconds <= 0) return;
            isMiniTimerRunning = true; miniStartPauseBtn.textContent = 'Pause'; miniStartPauseBtn.classList.add('pause');
            miniTimerInterval = setInterval(() => {
                if (miniTotalSeconds > 0) { miniTotalSeconds--; miniTimeDisplay.textContent = formatTime(miniTotalSeconds); }
                else { clearInterval(miniTimerInterval); isMiniTimerRunning = false; miniStartPauseBtn.textContent = 'Done!'; miniStartPauseBtn.classList.remove('pause'); miniTimeDisplay.classList.add('countdown-ended'); }
            }, 1000);
        }
        function pauseMiniTimer() { clearInterval(miniTimerInterval); isMiniTimerRunning = false; miniStartPauseBtn.textContent = 'Resume'; miniStartPauseBtn.classList.remove('pause'); }
        function resetMiniTimer() {
            clearInterval(miniTimerInterval); isMiniTimerRunning = false;
            miniStartPauseBtn.textContent = 'Start'; miniStartPauseBtn.classList.remove('pause');
            miniTotalSeconds = DEFAULT_MINI_TIMER_SECONDS;
            miniTimeDisplay.textContent = formatTime(miniTotalSeconds); miniTimeDisplay.classList.remove('countdown-ended');
        }
        miniStartPauseBtn.addEventListener('click', () => isMiniTimerRunning ? pauseMiniTimer() : startMiniTimer());
        miniResetBtn.addEventListener('click', resetMiniTimer);

        // --- GOOGLE SHEETS INTEGRATION ---
        function collectGameData() {
            const players = [];
            document.querySelectorAll('.player-item').forEach(item => {
                players.push({
                    number: item.querySelector('.player-number')?.textContent.replace('#', '') || 'N/A',
                    name: item.querySelector('.player-name')?.textContent || 'Unnamed', time: item.querySelector('.player-time')?.textContent || '00:00'
                });
            });
            return { teamName: teamSelect.value || '', gameDate: new Date().toLocaleString(), mainTime: timeDisplay.textContent, players, notes: document.getElementById('game-notes').value };
        }
        function sendDataToSheets() {
            const gameData = collectGameData();
            if (!gameData.teamName) { showConfirmation('Required Field Missing', 'Please select a Team Name before saving.'); return; }
            saveToSheetsBtn.disabled = true; saveToSheetsBtn.textContent = 'Saving...';
            fetch(SCRIPT_URL, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(gameData) })
                .then(res => res.json()).then(data => { showConfirmation('Success!', `Game is saved for "${gameData.teamName}".`); })
                .catch(error => { console.error('Error:', error); showConfirmation('Network Error', `A network error occurred. Details: ${error}`); })
                .finally(() => { saveToSheetsBtn.disabled = false; saveToSheetsBtn.textContent = 'Finish Game'; });
        }
        saveToSheetsBtn.addEventListener('click', () => { showConfirmation('Finish and Save Game', 'End this session and save final times to Google Sheets?', (c) => { if (c) sendDataToSheets(); }); });

        document.getElementById('update-app-btn').addEventListener('click', () => { location.reload(true); });

        // --- SCREEN WAKE LOCK ---
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock is active');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
        requestWakeLock();
    </script>
</body>
