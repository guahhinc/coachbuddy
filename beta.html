<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coachbuddy</title>
    
    <!-- FAVICON -->
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCEsy3JshuCcp0rymJuhtf2MTszkAF88z_eQ&s">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCEsy3JshuCcp0rymJuhtf2MTszkAF88z_eQ&s">

    <!-- iOS WEB APP CAPABILITIES -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Coachbuddy">
    <meta name="theme-color" content="#151515">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: #151515;
            color: #E0E0E0;
            height: 100%; 
            overflow-x: hidden; overflow-y: auto; 
            font-size: 14px; 
            padding-top: 50vh;
        }
        
        .app-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: -50vh; }
        .app-container { width: 100%; max-width: 460px; padding: 12px; padding-bottom: 60px; }

        /* --- CARDS --- */
        .card {
            background-color: #222222; padding: 12px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #2A2A2A;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* --- INPUTS --- */
        input[type="text"], select, textarea {
            width: 100%; padding: 10px; border-radius: 8px; font-size: 15px;
            background-color: #2C2C2E; color: #FFFFFF; border: 1px solid #38383A;
            appearance: none; outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: #0A84FF; }
        label { color: #888; font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }

        /* --- BUTTONS --- */
        .timer-btn {
            padding: 10px 14px; border: none; border-radius: 10px;
            cursor: pointer; font-weight: 600; font-size: 14px;
            transition: background-color 0.2s, transform 0.1s;
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            line-height: 1.2;
        }
        .timer-btn:active { transform: scale(0.97); }
        .timer-btn.primary { background-color: #0A84FF; color: white; }
        .timer-btn.primary.pause { background-color: #FF9F0A; color: black; }
        .timer-btn.secondary { background-color: #333333; color: #E0E0E0; }
        .timer-btn.secondary:hover { background-color: #3E3E3E; }

        .team-header-row { display: flex; gap: 8px; align-items: flex-end; }
        .history-btn { flex-grow: 0; width: auto; background-color: #2C2C2E; border: 1px solid #38383A; color: #0A84FF; }

        /* --- TIMER --- */
        #timer-section { text-align: center; padding-bottom: 14px; }
        #time-display {
            font-size: 3.8rem; font-weight: 600; color: #FFFFFF;
            margin: 5px 0 10px 0; font-variant-numeric: tabular-nums;
            letter-spacing: -1px; line-height: 1;
        }
        #time-display.countdown-ended { color: #FF453A; }
        
        .timer-controls { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }

        /* FIX: Specific style for adjustment buttons to make text WHITE */
        .adjust-controls .timer-btn {
            padding: 6px 12px; 
            font-size: 12px; 
            background-color: #2C2C2E; 
            border: 1px solid #38383A;
            color: #FFFFFF !important; /* Force White Text */
        }

        /* --- ROSTER --- */
        #roster-container { padding: 0; overflow: hidden; }
        .roster-header {
            padding: 10px 12px; background-color: #2A2A2A;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333;
        }
        .sort-btn { background-color: #38383A; color: #0A84FF; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .player-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border-bottom: 1px solid #2C2C2E; background-color: #222222;
        }
        .player-item:last-child { border-bottom: none; }
        .player-info-group { display: flex; align-items: center; gap: 8px; flex-grow: 1; padding-right: 8px; }
        
        .player-rank {
            font-weight: 700; color: #888; background-color: #333; font-size: 11px;
            width: 20px; height: 20px; line-height: 20px; text-align: center;
            border-radius: 6px; flex-shrink: 0;
        }
        .player-rank.rank-color-1 { background-color: #FF453A; color: white; }
        .player-rank.rank-color-2 { background-color: #FF9F0A; color: black; }
        .player-rank.rank-color-3 { background-color: #30D158; color: black; }
        .player-rank.rank-color-4 { background-color: #64D2FF; color: black; }
        
        .player-number { color: #64D2FF; font-size: 14px; font-weight: 600; }
        .player-name { font-weight: 500; font-size: 15px; }
        .warning-icon.low { color: #FFD60A; font-size: 16px; margin-left: 4px;}
        .player-time { font-weight: 600; color: #888; font-size: 14px; min-width: 45px; text-align: right; font-variant-numeric: tabular-nums; }
        
        .toggle-btn {
            padding: 6px 0; width: 50px; font-size: 12px; font-weight: 700;
            border-radius: 8px; border: none; cursor: pointer; margin-left: 8px;
        }
        .toggle-btn.status-on { background-color: #30D158; color: black; }
        .toggle-btn.status-off { background-color: #333; color: #AAA; border: 1px solid #444; }
        .delete-btn { width: 24px; height: 24px; font-size: 14px; border-radius: 6px; border: none; background: transparent; color: #666; margin-left: 4px; }
        
        .add-icon-btn {
            background-color: #30D158; color: black; width: 40px; height: 40px;
            border-radius: 10px; border: none; font-size: 24px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

        /* --- MODAL --- */
        .modal-overlay {
            backdrop-filter: blur(5px); background-color: rgba(0, 0, 0, 0.6); 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #1F1F1F; padding: 20px; border-radius: 16px;
            width: 90%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center; border: 1px solid #333; 
            display: flex; flex-direction: column; max-height: 85vh;
        }
        #modal-title { font-size: 1.1rem; margin: 0 0 10px 0; color: #FFF; flex-shrink: 0; }
        #modal-message { 
            margin-bottom: 16px; color: #CCC; font-size: 14px; line-height: 1.4; 
            overflow-y: auto; text-align: left; 
        }

        /* --- HISTORY LOGS STYLING --- */
        .log-item {
            background-color: #222; padding: 0; border-radius: 10px; 
            margin-bottom: 12px; border: 1px solid #333; overflow: hidden;
        }
        .log-header {
            display: flex; justify-content: space-between; 
            padding: 10px 12px; background-color: #2A2A2A;
            border-bottom: 1px solid #333;
            font-weight: 600; color: #FFF; font-size: 13px;
        }
        .log-body { padding: 10px 12px; }
        
        .log-player-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; margin-bottom: 4px; padding-bottom: 4px;
            border-bottom: 1px solid #2C2C2E;
        }
        .log-player-row:last-child { border-bottom: none; margin-bottom: 0; }
        
        .p-num { color: #64D2FF; font-weight: 700; width: 30px; }
        .p-name { color: #DDD; flex-grow: 1; text-align: left; }
        .p-time { color: #AAA; font-variant-numeric: tabular-nums; font-weight: 600; }
        
        .log-simple-text {
            white-space: pre-line; color: #AAA; font-size: 12px;
        }

        .log-notes {
            font-size: 12px; color: #888; font-style: italic; 
            margin-top: 8px; padding-top: 8px; border-top: 1px dashed #333;
        }

        .suggestion-group { background-color: #2A2A2A; padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: left; }
        .suggestion-group .sub-off { color: #FF453A; }
        .suggestion-group .sub-on { color: #30D158; }
        .modal-buttons { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="app-container">
            
            <!-- TEAM SELECT & LOGS -->
            <div class="card" id="team-name-section">
                <div class="team-header-row">
                    <div style="flex-grow: 1;">
                        <label for="team-select">Team Name</label>
                        <select id="team-select">
                            <option value="" disabled selected>Select a Team...</option>
                            <option value="TLS Aces">TLS Aces</option>
                            <option value="Test Team">Test Team</option>
                        </select>
                    </div>
                    <button id="view-logs-btn" class="timer-btn history-btn">History</button>
                </div>
            </div>
            
            <!-- MAIN TIMER -->
            <div class="card" id="timer-section">
                <div id="time-display">00:00</div>
                <div class="timer-controls mode-main-controls">
                    <button id="reset-btn" class="timer-btn secondary">Reset</button>
                    <button id="start-pause-btn" class="timer-btn primary">Start</button>
                    <button id="mode-toggle-btn" class="timer-btn secondary">Mode</button>
                </div>
                <div class="timer-controls adjust-controls">
                    <button id="subtract-minute-btn" class="timer-btn">–1 Min</button>
                    <button id="add-minute-btn" class="timer-btn">+1 Min</button>
                </div>
            </div>
      
            <!-- PLAYER INPUT -->
            <div class="card" id="input-section" style="display:flex; gap:8px;">
                <input type="text" id="player-number-input" placeholder="#" inputmode="numeric" style="width:50px; text-align:center;"> 
                <input type="text" id="player-name" placeholder="New player name...">
                <button id="add-player-btn" class="add-icon-btn">+</button>
            </div>
            
            <!-- ROSTER -->
            <div class="card" id="roster-container">
                <div class="roster-header">
                    <span style="font-size: 12px; font-weight:700; color:#888;">ROSTER</span>
                    <div class="sort-buttons-group">
                        <button id="sort-desc-btn" class="sort-btn">Most ▼</button>
                        <button id="sort-asc-btn" class="sort-btn">Least ▲</button>
                    </div>
                </div>
                <div id="roster"></div>
            </div>

            <!-- NOTES -->
            <div class="card" id="notes-section">
                <label for="game-notes">Notes</label>
                <textarea id="game-notes" placeholder="Game details..."></textarea>
            </div>
            
            <!-- ACTIONS -->
            <div class="action-grid">
                <button id="suggest-sub-btn" class="timer-btn secondary">Suggest Sub</button>
                <button id="add-default-players-btn" class="timer-btn secondary">Default Roster</button>
            </div>
            <div style="margin-top: 8px;">
                <button id="save-to-sheets-btn" class="timer-btn primary" style="width: 100%; background-color: #0A84FF;">Finish & Save Game</button>
            </div>

        </div>
    </div>
    
    <!-- Custom Modal -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <div id="modal-message"></div>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8aTjhphj_HhJ1g0uTTrZ2HwfEKUeLHBZSrZl53sxYjhzaNzotvp7U0JJOllntzLwXFw/exec';
        
        const MAX_PLAYERS_ON_FIELD = 5;
        const MIN_GAME_TIME_FOR_WARNINGS = 180; 
        const LOW_TIME_RATIO = 0.65; 
        const SIGNIFICANT_TIME_GAP = 240; 
        const INITIAL_STOPWATCH_SECONDS = 0;
        const DEFAULT_COUNTDOWN_SECONDS = 2400; 
        const LOCAL_STORAGE_KEY = 'coachbuddySelectedTeam';

        // --- STATE VARIABLES ---
        let countdownInterval = null, totalSeconds = INITIAL_STOPWATCH_SECONDS, isRunning = false, isCountdownMode = false;

        // --- UTILS ---
        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }
        
        // --- DOM ---
        const timeDisplay = document.getElementById('time-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const addMinuteBtn = document.getElementById('add-minute-btn');
        const subtractMinuteBtn = document.getElementById('subtract-minute-btn');
        const playerNumberInput = document.getElementById('player-number-input');
        const playerNameInput = document.getElementById('player-name');
        const addPlayerBtn = document.getElementById('add-player-btn');
        const rosterDiv = document.getElementById('roster');
        const suggestSubBtn = document.getElementById('suggest-sub-btn');
        const addDefaultPlayersBtn = document.getElementById('add-default-players-btn');
        const saveToSheetsBtn = document.getElementById('save-to-sheets-btn');
        const viewLogsBtn = document.getElementById('view-logs-btn');
        const teamSelect = document.getElementById('team-select'); 
        const sortDescBtn = document.getElementById('sort-desc-btn');
        const sortAscBtn = document.getElementById('sort-asc-btn');

        // --- INIT ---
        window.addEventListener('load', () => {
            const savedTeam = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (savedTeam) teamSelect.value = savedTeam;
        });
        teamSelect.addEventListener('change', () => {
            localStorage.setItem(LOCAL_STORAGE_KEY, teamSelect.value);
        });
        
        // --- MODAL SYSTEM ---
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalButtons = document.getElementById('modal-buttons');

        function closeModal() { customModal.style.display = 'none'; }

        function showCustomModal(title, messageHtml, buttons) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = messageHtml;
            modalButtons.innerHTML = ''; 

            buttons.forEach(btnInfo => {
                const button = document.createElement('button');
                button.textContent = btnInfo.text;
                button.className = `timer-btn ${btnInfo.className || 'primary'}`;
                button.onclick = (e) => btnInfo.action(e);
                modalButtons.appendChild(button);
            });
            customModal.style.display = 'flex';
        }
        
        function showConfirmation(title, message, callback) {
            let buttons = [];
            if (callback) {
                buttons.push({ text: 'Confirm', className: 'primary', action: () => { callback(true); closeModal(); } });
                buttons.push({ text: 'Cancel', className: 'secondary', action: () => { callback(false); closeModal(); } });
            } else {
                buttons.push({ text: 'OK', className: 'primary', action: closeModal });
            }
            showCustomModal(title, `<p>${message}</p>`, buttons);
        }

        // --- ROSTER LOGIC ---
        function createPlayerItem(name, number = null) {
            const playerItem = document.createElement('div');
            playerItem.className = 'player-item';
            playerItem.dataset.totalTime = 0; playerItem.dataset.isOnField = '0'; playerItem.dataset.rank = '0'; 

            const playerInfoGroup = document.createElement('div');
            playerInfoGroup.className = 'player-info-group';

            const playerRankDisplay = document.createElement('span');
            playerRankDisplay.className = 'player-rank'; playerRankDisplay.textContent = '-'; 
            playerRankDisplay.dataset.role = 'player-rank-display';
            playerInfoGroup.appendChild(playerRankDisplay);

            if (number !== null) {
                const playerNumber = document.createElement('span');
                playerNumber.className = 'player-number'; playerNumber.textContent = `#${number}`; 
                playerInfoGroup.appendChild(playerNumber);
            }

            const playerName = document.createElement('span');
            playerName.className = 'player-name'; playerName.textContent = name;
            playerInfoGroup.appendChild(playerName);
            
            const lowWarningIcon = document.createElement('span');
            lowWarningIcon.className = 'warning-icon low'; lowWarningIcon.textContent = '⚠️';
            lowWarningIcon.style.display = 'none';
            lowWarningIcon.dataset.role = 'low-warning-icon';
            playerInfoGroup.appendChild(lowWarningIcon); 

            const playerControlsGroup = document.createElement('div');
            playerControlsGroup.style.display = 'flex'; playerControlsGroup.style.alignItems = 'center';
            
            const timeOnFieldDisplay = document.createElement('span');
            timeOnFieldDisplay.className = 'player-time'; timeOnFieldDisplay.textContent = formatTime(0);

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-btn status-off'; toggleBtn.textContent = 'ON';
            
            toggleBtn.onclick = () => {
                const isOn = playerItem.dataset.isOnField === '1';
                if (isOn) {
                    playerItem.dataset.isOnField = '0';
                    toggleBtn.textContent = 'ON';
                    toggleBtn.classList.add('status-off'); toggleBtn.classList.remove('status-on');
                } else {
                    const currentOnCount = document.querySelectorAll('.player-item[data-is-on-field="1"]').length;
                    if (currentOnCount >= MAX_PLAYERS_ON_FIELD) {
                        showConfirmation('Limit Reached', `Max ${MAX_PLAYERS_ON_FIELD} players on field.`);
                        return;
                    }
                    playerItem.dataset.isOnField = '1';
                    toggleBtn.textContent = 'OFF';
                    toggleBtn.classList.remove('status-off'); toggleBtn.classList.add('status-on');
                }
                updateSubstitutionWarnings();
            };
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn'; deleteBtn.textContent = '×';
            deleteBtn.onclick = () => {
                showConfirmation('Remove', `Remove ${name}?`, (confirmed) => {
                        if (confirmed) { rosterDiv.removeChild(playerItem); updateSubstitutionWarnings(); }
                });
            };

            playerControlsGroup.appendChild(timeOnFieldDisplay);
            playerControlsGroup.appendChild(toggleBtn);
            playerControlsGroup.appendChild(deleteBtn);
            playerItem.appendChild(playerInfoGroup);
            playerItem.appendChild(playerControlsGroup);
            return playerItem;
        }
        
        function addPlayerByName(name, number = null) {
            const effectiveName = name || (number !== null ? `Player #${number}` : 'Unnamed');
            rosterDiv.appendChild(createPlayerItem(effectiveName, number));
            updateSubstitutionWarnings();
        }

        function addPlayerFromInput() {
            const name = playerNameInput.value.trim();
            const number = parseInt(playerNumberInput.value.trim()) || null;
            if (name || number) { 
                addPlayerByName(name, number);
                playerNameInput.value = ''; playerNumberInput.value = ''; playerNameInput.focus();
                setTimeout(() => { window.scrollTo(0, 0); }, 200);
            }
        }

        addPlayerBtn.addEventListener('click', addPlayerFromInput);
        playerNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayerFromInput(); });
        playerNumberInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayerFromInput(); });

        // --- SORT & DEFAULTS ---
        function sortRoster(direction) {
            const items = Array.from(rosterDiv.children);
            items.sort((a, b) => {
                const timeA = parseInt(a.dataset.totalTime);
                const timeB = parseInt(b.dataset.totalTime);
                return direction === 'desc' ? timeB - timeA : timeA - timeB;
            });
            items.forEach(item => rosterDiv.appendChild(item));
        }
        sortDescBtn.addEventListener('click', () => sortRoster('desc'));
        sortAscBtn.addEventListener('click', () => sortRoster('asc'));
        
        const DEFAULT_ROSTERS = {
            'TLS Aces': [ { name: 'Ava', number: 6 }, { name: 'Maddie', number: 32 }, { name: 'AK', number: 52 }, 
                { name: 'Indigo', number: 50 }, { name: 'Aria', number: 7 }, { name: 'London', number: 8 },
                { name: 'Sienna', number: null }, { name: 'Amelia', number: 10 } ],
            'Test Team': []
        };

        addDefaultPlayersBtn.addEventListener('click', () => {
            const selectedTeam = teamSelect.value;
            if (!selectedTeam) { showConfirmation('No Team', 'Select a team first.'); return; }
            const roster = DEFAULT_ROSTERS[selectedTeam];
            if (!roster || roster.length === 0) { showConfirmation('Empty', `No defaults for ${selectedTeam}.`); return; }
            showConfirmation(`Add Roster`, `Add default roster for ${selectedTeam}?`,
                (confirmed) => { if (confirmed) roster.forEach(p => addPlayerByName(p.name, p.number)); }
            );
        });

        // --- SUB SUGGESTION ---
        function performSub(playerOff, playerOn, buttonElement) {
            if (playerOff && playerOff.element) playerOff.element.querySelector('.toggle-btn')?.click();
            if (playerOn && playerOn.element) playerOn.element.querySelector('.toggle-btn')?.click();
            buttonElement.textContent += ' ✅';
            buttonElement.disabled = true;
        }

        function suggestSubstitution() {
            const playerItems = document.querySelectorAll('.player-item');
            if (playerItems.length < 2) { showConfirmation('Info', 'Need more players for suggestions.'); return; }

            const players = Array.from(playerItems).map(item => ({ 
                element: item, time: parseInt(item.dataset.totalTime), isOnField: item.dataset.isOnField === '1',
                name: `${item.querySelector('.player-number')?.textContent || ''} ${item.querySelector('.player-name')?.textContent || ''}`.trim()
            }));
            
            const onField = players.filter(p => p.isOnField).sort((a, b) => b.time - a.time);
            const offField = players.filter(p => !p.isOnField).sort((a, b) => a.time - b.time);
            
            let messageHtml = '';
            const buttons = [];

            if (onField.length > 0 && offField.length > 0) {
                const [playerOff1, playerOn1] = [onField[0], offField[0]];
                messageHtml += `<div class="suggestion-group"><strong>Suggestion 1</strong><p class="sub-off">▶ OFF: ${playerOff1.name} (${formatTime(playerOff1.time)})</p><p class="sub-on">◀ ON: ${playerOn1.name} (${formatTime(playerOn1.time)})</p></div>`;
                buttons.push({ text: 'Apply Sub 1', action: (e) => performSub(playerOff1, playerOn1, e.target) });
                
                if (onField.length > 1 && offField.length > 1) {
                    const [playerOff2, playerOn2] = [onField[1], offField[1]];
                    messageHtml += `<div class="suggestion-group"><strong>Suggestion 2</strong><p class="sub-off">▶ OFF: ${playerOff2.name} (${formatTime(playerOff2.time)})</p><p class="sub-on">◀ ON: ${playerOn2.name} (${formatTime(playerOn2.time)})</p></div>`;
                    buttons.push({ text: 'Apply Sub 2', action: (e) => performSub(playerOff2, playerOn2, e.target) });
                }
                buttons.push({ text: 'Close', className: 'secondary', action: closeModal });
            } else {
                messageHtml = `<p>Cannot make a suggestion.</p>`;
                buttons.push({ text: 'OK', className: 'secondary', action: closeModal });
            }
            showCustomModal('Sub Suggestions', messageHtml, buttons);
        }
        suggestSubBtn.addEventListener('click', suggestSubstitution);

        function updateSubstitutionWarnings() {
            const items = document.querySelectorAll('.player-item'); if (items.length === 0) return;
            let totalTime = 0, onFieldTime = 0, onFieldCount = 0;
            const players = Array.from(items).map(item => {
                const time = parseInt(item.dataset.totalTime); totalTime += time;
                if (item.dataset.isOnField === '1') { onFieldTime += time; onFieldCount++; }
                return { element: item, time };
            });

            players.sort((a, b) => b.time - a.time);
            let rank = 0, prevTime = -1;
            players.forEach(p => { 
                if (p.time !== prevTime) rank++; prevTime = p.time; 
                const rankDisplay = p.element.querySelector('[data-role="player-rank-display"]');
                if (rankDisplay) {
                    rankDisplay.textContent = rank;
                    rankDisplay.className = 'player-rank';
                    if (rank <= 4) rankDisplay.classList.add(`rank-color-${rank}`);
                }
            });
            
            if (players.length < 2 || totalSeconds < MIN_GAME_TIME_FOR_WARNINGS || totalTime === 0) {
                 items.forEach(i => i.querySelector('[data-role="low-warning-icon"]').style.display = 'none'); return;
            }
            
            const avgTime = onFieldCount > 0 ? onFieldTime / onFieldCount : 0;
            items.forEach(item => {
                const icon = item.querySelector('[data-role="low-warning-icon"]');
                const time = parseInt(item.dataset.totalTime);
                const isOn = item.dataset.isOnField === '1';
                const isLowRatio = time < (avgTime * LOW_TIME_RATIO);
                const isBigGap = (avgTime - time) > SIGNIFICANT_TIME_GAP;
                icon.style.display = (!isOn && avgTime > 0 && (isLowRatio || isBigGap)) ? 'inline' : 'none';
            });
        }
        
        // --- TIMER LOGIC ---
        function startTimer() {
            if (isRunning || (isCountdownMode && totalSeconds <= 0)) return;
            isRunning = true; startPauseBtn.textContent = 'Pause'; startPauseBtn.classList.add('pause');
            countdownInterval = setInterval(() => {
                if (isCountdownMode) {
                    if (totalSeconds > 0) totalSeconds--;
                    else { clearInterval(countdownInterval); isRunning = false; startPauseBtn.textContent = 'Done!'; startPauseBtn.classList.remove('pause'); timeDisplay.classList.add('countdown-ended'); }
                } else totalSeconds++;
                timeDisplay.textContent = formatTime(totalSeconds);
                document.querySelectorAll('.player-item[data-is-on-field="1"]').forEach(item => {
                    let time = parseInt(item.dataset.totalTime) + 1;
                    item.dataset.totalTime = time; item.querySelector('.player-time').textContent = formatTime(time);
                });
                updateSubstitutionWarnings();
            }, 1000);
        }
        function pauseTimer() { clearInterval(countdownInterval); isRunning = false; startPauseBtn.textContent = 'Start'; startPauseBtn.classList.remove('pause'); }
        function resetTimer() {
            clearInterval(countdownInterval); isRunning = false;
            startPauseBtn.textContent = 'Start'; startPauseBtn.classList.remove('pause');
            timeDisplay.classList.remove('countdown-ended');
            totalSeconds = isCountdownMode ? DEFAULT_COUNTDOWN_SECONDS : INITIAL_STOPWATCH_SECONDS;
            timeDisplay.textContent = formatTime(totalSeconds);
            document.querySelectorAll('.player-item').forEach(item => {
                item.dataset.totalTime = 0; item.querySelector('.player-time').textContent = formatTime(0);
                item.dataset.isOnField = '0'; 
                const btn = item.querySelector('.toggle-btn');
                if(btn) { btn.textContent = 'ON'; btn.classList.add('status-off'); btn.classList.remove('status-on'); }
            });
            updateSubstitutionWarnings();
        }
        function adjustTime(s) { 
            totalSeconds = Math.max(0, totalSeconds + s); 
            timeDisplay.textContent = formatTime(totalSeconds); 
            updateSubstitutionWarnings(); 
        }
        startPauseBtn.addEventListener('click', () => isRunning ? pauseTimer() : startTimer());
        resetBtn.addEventListener('click', () => { showConfirmation('Confirm Reset', 'Reset timer and player stats?', (c) => { if (c) resetTimer(); }); });
        modeToggleBtn.addEventListener('click', () => { 
            showConfirmation('Switch Mode', 'Switching modes resets the timer.', (c) => { 
                if (c) { isCountdownMode = !isCountdownMode; modeToggleBtn.textContent = isCountdownMode ? 'Stopwatch' : 'Countdown'; resetTimer(); } 
            }); 
        });
        addMinuteBtn.addEventListener('click', () => adjustTime(60));
        subtractMinuteBtn.addEventListener('click', () => adjustTime(-60));
        timeDisplay.textContent = formatTime(INITIAL_STOPWATCH_SECONDS);

        // --- DATA & LOGS INTEGRATION ---
        function collectGameData() {
            const players = [];
            document.querySelectorAll('.player-item').forEach(item => {
                players.push({ number: item.querySelector('.player-number')?.textContent.replace('#', '') || 'N/A', 
                name: item.querySelector('.player-name')?.textContent || 'Unnamed', time: item.querySelector('.player-time')?.textContent || '00:00' });
            });
            return { action: 'save', teamName: teamSelect.value || '', mainTime: timeDisplay.textContent, players, notes: document.getElementById('game-notes').value };
        }

        function sendDataToSheets() {
            const gameData = collectGameData();
            if (!gameData.teamName) { showConfirmation('Error', 'Select a Team Name.'); return; }
            saveToSheetsBtn.disabled = true; saveToSheetsBtn.textContent = 'Saving...';
            
            fetch(SCRIPT_URL, { method: 'POST', mode: 'cors', body: JSON.stringify(gameData) })
            .then(res => res.json())
            .then(data => { showConfirmation('Saved', `Game saved for ${gameData.teamName}.`); })
            .catch(error => { console.error('Error:', error); showConfirmation('Error', 'Network error.'); })
            .finally(() => { saveToSheetsBtn.disabled = false; saveToSheetsBtn.textContent = 'Finish & Save Game'; });
        }
        saveToSheetsBtn.addEventListener('click', () => { showConfirmation('Save', 'Finish and save game?', (c) => { if (c) sendDataToSheets(); }); });

        // --- LOGS RETRIEVAL ---
        function fetchLogs() {
            const teamName = teamSelect.value;
            if (!teamName) { showConfirmation('Error', 'Select a team first to view history.'); return; }
            
            viewLogsBtn.disabled = true; viewLogsBtn.textContent = '...';
            
            fetch(SCRIPT_URL, { method: 'POST', mode: 'cors', body: JSON.stringify({ action: 'get_logs', teamName: teamName }) })
            .then(res => res.json())
            .then(data => {
                if(data.result === 'success') {
                    let logsHtml = '';
                    if(!data.logs || data.logs.length === 0) {
                        logsHtml = '<p style="color:#888;">No history found for this team.</p>';
                    } else {
                        data.logs.forEach(log => {
                            // 1. Duration & Date Cleanup (Fixes the "1899" issue)
                            let displayTime = log.duration;
                            if (displayTime.includes('T') && displayTime.includes('Z')) {
                                try { displayTime = displayTime.split('T')[1].split('.')[0].substring(0, 5); } catch(e){}
                            }
                            
                            const dateObj = new Date(log.date);
                            const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString() : log.date;
                            
                            // 2. Dual-Mode Parser (JSON -> Text Fallback)
                            let playerListHtml = '';
                            
                            // Try parsing JSON (New Data Format)
                            let parsed = false;
                            if (log.playersRaw && log.playersRaw.trim() !== "") {
                                try {
                                    const playersArr = JSON.parse(log.playersRaw);
                                    playersArr.forEach(p => {
                                        playerListHtml += `
                                            <div class="log-player-row">
                                                <span class="p-num">#${p.number}</span>
                                                <span class="p-name">${p.name}</span>
                                                <span class="p-time">${p.time}</span>
                                            </div>`;
                                    });
                                    parsed = true;
                                } catch (e) { console.log("JSON parse failed, falling back to text"); }
                            }

                            // If JSON failed or missing, parse the Readable Text (Old Data Format)
                            if (!parsed && log.playersReadable) {
                                // Example format: "London (#8): 00:00"
                                const lines = log.playersReadable.split('\n');
                                lines.forEach(line => {
                                    // simple regex to extract data
                                    const match = line.match(/^(.*?) \(#(.*?)\): (.*)$/);
                                    if (match) {
                                        playerListHtml += `
                                            <div class="log-player-row">
                                                <span class="p-num">#${match[2]}</span>
                                                <span class="p-name">${match[1]}</span>
                                                <span class="p-time">${match[3]}</span>
                                            </div>`;
                                    } else {
                                        // plain line fallback
                                        playerListHtml += `<div class="log-simple-text">${line}</div>`;
                                    }
                                });
                            }
                            
                            if(playerListHtml === '') playerListHtml = '<div class="log-simple-text">No player data.</div>';

                            logsHtml += `
                                <div class="log-item">
                                    <div class="log-header">
                                        <span>${dateStr}</span>
                                        <span style="color:#0A84FF;">${displayTime}</span>
                                    </div>
                                    <div class="log-body">
                                        ${playerListHtml}
                                        ${log.notes ? `<div class="log-notes">"${log.notes}"</div>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                    }
                    showCustomModal(`History: ${teamName}`, logsHtml, [{text: 'Close', className: 'secondary', action: closeModal}]);
                } else {
                    showConfirmation('Error', 'Failed to load logs. Ensure Script is updated.');
                }
            })
            .catch(e => { console.error(e); showConfirmation('Error', 'Network Error. Check console.'); })
            .finally(() => { viewLogsBtn.disabled = false; viewLogsBtn.textContent = 'History'; });
        }
        viewLogsBtn.addEventListener('click', fetchLogs);
    </script>
</body>
</html>
